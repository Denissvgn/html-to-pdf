[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "html-to-pdf"
version = "1.0.0"
description = "High-fidelity HTML to PDF conversion and merging service using headless Chromium"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Denis Sivagin"}
]
keywords = ["pdf", "html-to-pdf", "playwright", "chromium", "fastapi", "converter", "pdf-merge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup :: HTML",
]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "pypdf>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Denissvgn/html-to-pdf"
Repository = "https://github.com/Denissvgn/html-to-pdf"
Issues = "https://github.com/Denissvgn/html-to-pdf/issues"
Author = "https://github.com/Denissvgn"

[project.scripts]
html-to-pdf = "html_to_pdf.cli:main"
pdf-merge = "html_to_pdf.merger:main"

[tool.setuptools.packages.find]
include = ["html_to_pdf*"]

[tool.setuptools.package-data]
html_to_pdf = ["examples/*.html", "web/templates/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
